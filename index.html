<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans min-h-screen flex flex-col">

  <script>
    // 1. TU URL DE APPS SCRIPT (Copiada del paso anterior)
    const API_URL = "https://script.google.com/macros/s/AKfycbzrQOGxauOlMPZ9QVAs0oa5dLKEbpVJxQtWvl-2gA_MeBtNP6FqIk0O4xIhO_IHEgnX2w/exec"; 
    
    // 2. TU NÚMERO DE WHATSAPP (Con código de país y área, ej: 5491112345678)
    const NUMERO_WHATSAPP = "5491130334057"; 
  </script>

  <!-- NAVBAR -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-emerald-700 cursor-pointer flex items-center gap-2" onclick="mostrarVista('catalogo')">
        <i class="fa-solid fa-store"></i> Mi Catálogo
      </h1>
      <button onclick="toggleCarrito()" class="relative bg-emerald-50 text-emerald-700 px-4 py-2 rounded-full font-medium hover:bg-emerald-100 transition flex items-center gap-2">
        <i class="fa-solid fa-cart-shopping"></i>
        <span>Carrito</span>
        <span id="cart-count" class="bg-emerald-600 text-white text-xs px-2 py-0.5 rounded-full hidden">0</span>
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">

    <!-- CARGANDO -->
    <div id="loading" class="text-center py-20">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-emerald-600 border-t-transparent"></div>
      <p class="mt-4 text-gray-500 font-medium">Cargando productos...</p>
    </div>

    <!-- VISTA 1: CATÁLOGO -->
    <section id="vista-catalogo" class="hidden">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">Nuestros Productos</h2>
      <div id="grid-productos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </section>

    <!-- VISTA 2: DETALLE -->
    <section id="vista-detalle" class="hidden">
      <button onclick="mostrarVista('catalogo')" class="mb-6 text-emerald-700 font-medium hover:underline flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Volver al catálogo
      </button>
      
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
        <div>
          <div class="aspect-square bg-gray-100 rounded-xl overflow-hidden mb-4 border border-gray-100">
            <img id="detalle-img-principal" src="" alt="" class="w-full h-full object-cover">
          </div>
          <div id="detalle-miniaturas" class="flex gap-3 overflow-x-auto pb-2"></div>
        </div>

        <div class="flex flex-col justify-between">
          <div>
            <span id="detalle-categoria" class="text-xs font-semibold uppercase tracking-wider text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-md"></span>
            <h2 id="detalle-nombre" class="text-3xl font-bold text-gray-900 mt-3 mb-2"></h2>
            <p id="detalle-precio" class="text-2xl font-bold text-emerald-700 mb-4"></p>
            <div class="border-t border-b py-4 my-4">
              <h3 class="text-sm font-semibold text-gray-700 mb-2">Descripción</h3>
              <p id="detalle-descripcion" class="text-gray-600 whitespace-pre-line leading-relaxed"></p>
            </div>
          </div>
          <div id="detalle-acciones"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- CARRITO MODAL -->
  <div id="carrito-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden transition-opacity">
    <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-2xl flex flex-col">
      <div class="p-4 border-b flex justify-between items-center bg-gray-50">
        <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2">
          <i class="fa-solid fa-cart-shopping text-emerald-600"></i> Tu Pedido
        </h3>
        <button onclick="toggleCarrito()" class="text-gray-400 hover:text-gray-600 text-xl font-bold px-2">&times;</button>
      </div>

      <div id="carrito-items" class="p-4 flex-grow overflow-y-auto space-y-4"></div>

      <div class="p-4 border-t bg-gray-50">
        <div class="flex justify-between items-center mb-4">
          <span class="text-gray-600 font-medium">Total Estimado:</span>
          <span id="carrito-total" class="text-xl font-bold text-emerald-700">$0</span>
        </div>
        <button onclick="enviarPedidoWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20">
          <i class="fa-brands fa-whatsapp text-xl"></i> Enviar Pedido por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <script>
    let productosData = [];
    let carrito = [];

    document.addEventListener("DOMContentLoaded", () => {
      fetch(API_URL)
        .then(response => response.json())
        .then(data => {
          productosData = data;
          document.getElementById('loading').classList.add('hidden');
          mostrarVista('catalogo');
          renderizarCatalogo();
        })
        .catch(err => {
          console.error("Error al cargar:", err);
          document.getElementById('loading').innerHTML = `<p class="text-red-500 font-bold">Error al conectar con la base de datos.</p>`;
        });
    });

    function renderizarCatalogo() {
      const grid = document.getElementById('grid-productos');
      grid.innerHTML = '';

      productosData.forEach(prod => {
        const tieneStock = prod.stock === 'SI';
        const card = document.createElement('div');
        card.className = `bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden flex flex-col hover:shadow-md transition cursor-pointer ${!tieneStock ? 'opacity-60' : ''}`;
        
        card.innerHTML = `
          <div class="aspect-square bg-gray-100 overflow-hidden relative" onclick="verDetalle('${prod.id}')">
            <img src="${prod.fotos[0]}" alt="${prod.nombre}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
            ${!tieneStock ? '<span class="absolute top-2 right-2 bg-gray-900/80 text-white text-xs px-2 py-1 rounded font-semibold">Sin Stock</span>' : ''}
          </div>
          <div class="p-4 flex flex-col flex-grow justify-between">
            <div onclick="verDetalle('${prod.id}')">
              <span class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">${prod.categoria}</span>
              <h3 class="font-bold text-gray-800 mt-1 line-clamp-1">${prod.nombre}</h3>
              <p class="text-lg font-bold text-emerald-700 mt-2">$${prod.precio.toLocaleString()}</p>
            </div>
            <button 
              onclick="agregarAlCarrito('${prod.id}')" 
              ${!tieneStock ? 'disabled' : ''}
              class="mt-4 w-full py-2 px-3 rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2 ${tieneStock ? 'bg-emerald-50 text-emerald-700 hover:bg-emerald-600 hover:text-white' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}">
              <i class="fa-solid fa-cart-plus"></i> ${tieneStock ? 'Agregar' : 'Sin Stock'}
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function verDetalle(id) {
      const prod = productosData.find(p => p.id === id);
      if (!prod) return;

      document.getElementById('detalle-nombre').innerText = prod.nombre;
      document.getElementById('detalle-categoria').innerText = prod.categoria;
      document.getElementById('detalle-precio').innerText = `$${prod.precio.toLocaleString()}`;
      document.getElementById('detalle-descripcion').innerText = prod.descripcion || "Sin descripción disponible.";
      
      const imgPrincipal = document.getElementById('detalle-img-principal');
      imgPrincipal.src = prod.fotos[0];

      const miniaturasContenedor = document.getElementById('detalle-miniaturas');
      miniaturasContenedor.innerHTML = '';
      
      prod.fotos.forEach((foto, index) => {
        const thumb = document.createElement('img');
        thumb.src = foto;
        thumb.className = `w-16 h-16 object-cover rounded-lg border-2 cursor-pointer transition ${index === 0 ? 'border-emerald-600' : 'border-transparent hover:border-gray-300'}`;
        thumb.onclick = () => {
          imgPrincipal.src = foto;
          Array.from(miniaturasContenedor.children).forEach(c => c.classList.replace('border-emerald-600', 'border-transparent'));
          thumb.classList.replace('border-transparent', 'border-emerald-600');
        };
        miniaturasContenedor.appendChild(thumb);
      });

      const accionesDiv = document.getElementById('detalle-acciones');
      if (prod.stock === 'SI') {
        accionesDiv.innerHTML = `
          <button onclick="agregarAlCarrito('${prod.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20">
            <i class="fa-solid fa-cart-plus"></i> Agregar al Carrito
          </button>
        `;
      } else {
        accionesDiv.innerHTML = `
          <div class="bg-gray-100 text-gray-500 font-semibold text-center py-3 rounded-xl border border-gray-200">
            Producto Sin Stock Actualmente
          </div>
        `;
      }

      mostrarVista('detalle');
    }

    function mostrarVista(vista) {
      document.getElementById('vista-catalogo').classList.toggle('hidden', vista !== 'catalogo');
      document.getElementById('vista-detalle').classList.toggle('hidden', vista !== 'detalle');
      window.scrollTo(0, 0);
    }

    function agregarAlCarrito(id) {
      const prod = productosData.find(p => p.id === id);
      if (!prod || prod.stock !== 'SI') return;

      const itemExistente = carrito.find(item => item.id === id);
      if (itemExistente) {
        itemExistente.cantidad++;
      } else {
        carrito.push({ id: prod.id, nombre: prod.nombre, precio: prod.precio, cantidad: 1 });
      }

      actualizarCarritoUI();
      toggleCarrito(true);
    }

    function cambiarCantidad(id, cambio) {
      const item = carrito.find(i => i.id === id);
      if (!item) return;

      item.cantidad += cambio;
      if (item.cantidad <= 0) {
        carrito = carrito.filter(i => i.id !== id);
      }
      actualizarCarritoUI();
    }

    function actualizarCarritoUI() {
      const itemsContainer = document.getElementById('carrito-items');
      const countLabel = document.getElementById('cart-count');
      const totalLabel = document.getElementById('carrito-total');

      const totalItems = carrito.reduce((sum, i) => sum + i.cantidad, 0);
      const totalPrecio = carrito.reduce((sum, i) => sum + (i.precio * i.cantidad), 0);

      countLabel.innerText = totalItems;
      countLabel.classList.toggle('hidden', totalItems === 0);
      totalLabel.innerText = `$${totalPrecio.toLocaleString()}`;

      itemsContainer.innerHTML = '';

      if (carrito.length === 0) {
        itemsContainer.innerHTML = `
          <div class="text-center py-12 text-gray-400">
            <i class="fa-solid fa-basket-shopping text-4xl mb-3"></i>
            <p>Tu carrito está vacío</p>
          </div>
        `;
        return;
      }

      carrito.forEach(item => {
        const div = document.createElement('div');
        div.className = 'flex justify-between items-center border-b pb-3';
        div.innerHTML = `
          <div>
            <h4 class="font-bold text-gray-800 text-sm">${item.nombre}</h4>
            <p class="text-xs text-gray-500">$${item.precio.toLocaleString()} c/u</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="cambiarCantidad('${item.id}', -1)" class="w-7 h-7 rounded-lg bg-gray-100 font-bold hover:bg-gray-200">-</button>
            <span class="text-sm font-semibold w-5 text-center">${item.cantidad}</span>
            <button onclick="cambiarCantidad('${item.id}', 1)" class="w-7 h-7 rounded-lg bg-gray-100 font-bold hover:bg-gray-200">+</button>
          </div>
        `;
        itemsContainer.appendChild(div);
      });
    }

    function toggleCarrito(forzarAbrir = false) {
      const modal = document.getElementById('carrito-modal');
      if (forzarAbrir) {
        modal.classList.remove('hidden');
      } else {
        modal.classList.toggle('hidden');
      }
    }

    function enviarPedidoWhatsApp() {
      if (carrito.length === 0) {
        alert("Agrega productos al carrito antes de enviar el pedido.");
        return;
      }

      let mensaje = "¡Hola! Quisiera realizar el siguiente pedido desde el catálogo:\n\n";
      let total = 0;

      carrito.forEach(item => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        mensaje += `• ${item.cantidad}x ${item.nombre} - $${subtotal.toLocaleString()}\n`;
      });

      mensaje += `\n*Total Estimado: $${total.toLocaleString()}*\n\n¿Tienen disponibilidad para coordinar la entrega?`;

      const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
