<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Oeste - Catálogo Holístico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Definición de la Paleta de Colores de Aura Oeste */
    :root {
      --color-dorado: #B88E43;
      --color-azul-gris: #8DAA9F;
      --color-fondo-crema: #F7F5F0;
      --color-texto-principal: #4A4A4A;
      --color-blanco: #FFFFFF;
    }

    body {
      background-color: var(--color-fondo-crema);
      color: var(--color-texto-principal);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    /* Estilos para el Scrollbar de miniaturas */
    .scrollbar-thin::-webkit-scrollbar { height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
  </style>
</head>
<body class="antialiased font-sans min-h-screen flex flex-col">

  <script>
    // --- PEGA AQUÍ TUS DATOS DE CONFIGURACIÓN ---
    // 1. URL de tu Apps Script (termina en /exec)
    const API_URL = "https://script.google.com/macros/s/AKfycbzrQOGxauOlMPZ9QVAs0oa5dLKEbpVJxQtWvl-2gA_MeBtNP6FqIk0O4xIhO_IHEgnX2w/exec"; 
    
    // 2. Número de WhatsApp completo con código de país (ej: 5491112345678)
    const NUMERO_WHATSAPP = "5491130334057"; 
  </script>

  <!-- NAVBAR -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <!-- LOGO DE AURA OESTE -->
      <a href="#" onclick="filtrarCategoria('TODAS')" class="flex items-center gap-3">
        <img src="https://i.ibb.co/VvzK7bT/AURA-OESTE-LOGO.png" alt="Aura Oeste Logo" class="h-14 w-auto"> <!-- URL del logo -->
      </a>
      
      <button onclick="toggleCarrito()" class="relative bg-[var(--color-azul-gris)] text-white px-5 py-2.5 rounded-full font-medium hover:opacity-90 transition flex items-center gap-2 shadow">
        <i class="fa-solid fa-cart-shopping"></i>
        <span>Carrito</span>
        <span id="cart-count" class="bg-[var(--color-dorado)] text-white text-xs px-2.5 py-1 rounded-full hidden">0</span>
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">

    <!-- CARGANDO -->
    <div id="loading" class="text-center py-24">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-[var(--color-azul-gris)] border-t-transparent"></div>
      <p class="mt-5 text-gray-500 font-medium">Cargando catálogo holístico...</p>
    </div>

    <!-- VISTA 1: CATÁLOGO -->
    <section id="vista-catalogo" class="hidden">
      <!-- Filtros de Categorías -->
      <div class="mb-10 p-5 bg-white rounded-2xl shadow-sm border border-gray-100">
        <h3 class="text-sm font-semibold text-[var(--color-dorado)] uppercase tracking-wider mb-4 flex items-center gap-2">
            <i class="fa-solid fa-leaf"></i> Categorías Holísticas
        </h3>
        <div id="categorias-botones" class="flex flex-wrap gap-2.5">
          <!-- Botones de categoría generados por JS -->
        </div>
      </div>

      <h2 id="titulo-categoria-activa" class="text-3xl font-bold mb-8 text-[var(--color-dorado)]">Todos los Productos</h2>
      <div id="grid-productos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-7"></div>
    </section>

    <!-- VISTA 2: DETALLE INDIVIDUAL (Carrusel + Aromas + WhatsApp) -->
    <section id="vista-detalle" class="hidden">
      <button onclick="mostrarVista('catalogo')" class="mb-8 text-[var(--color-dorado)] font-semibold hover:underline flex items-center gap-2.5 text-lg">
        <i class="fa-solid fa-arrow-left"></i> Volver al catálogo
      </button>
      
      <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 md:p-10 grid grid-cols-1 md:grid-cols-2 gap-10">
        <!-- Carrusel de Fotos (Hasta 9) -->
        <div>
          <div class="aspect-square bg-gray-50 rounded-2xl overflow-hidden mb-5 border border-gray-100 relative shadow-inner">
            <img id="detalle-img-principal" src="" alt="" class="w-full h-full object-cover">
          </div>
          <!-- Miniaturas scrolleables -->
          <div id="detalle-miniaturas" class="flex gap-2.5 overflow-x-auto pb-3 scrollbar-thin"></div>
        </div>

        <!-- Información -->
        <div class="flex flex-col justify-between">
          <div>
            <span id="detalle-categoria" class="text-xs font-bold uppercase tracking-widest text-[var(--color-azul-gris)] bg-[var(--color-fondo-crema)] px-3 py-1.5 rounded-full border border-[var(--color-azul-gris)]"></span>
            <h2 id="detalle-nombre" class="text-4xl font-extrabold text-[var(--color-dorado)] mt-5 mb-3 leading-tight"></h2>
            <p id="detalle-precio" class="text-3xl font-bold text-[var(--color-texto-principal)] mb-6"></p>
            
            <!-- Selector de Aroma (Si tiene) -->
            <div id="contenedor-aroma" class="mb-6 p-5 bg-[var(--color-fondo-crema)] rounded-2xl hidden border border-[var(--color-azul-gris)]">
              <label class="block text-base font-semibold text-[var(--color-texto-principal)] mb-2.5 flex items-center gap-2">
                  <i class="fa-solid fa-spa text-[var(--color-azul-gris)]"></i> Aroma Solicitado:
              </label>
              <select id="select-aroma" class="w-full border-2 border-[var(--color-dorado)] rounded-xl p-3.5 bg-white focus:outline-none focus:ring-2 focus:ring-[var(--color-dorado)] font-medium text-lg">
              </select>
            </div>

            <div class="border-t border-b py-5 my-5 border-gray-100">
              <h3 class="text-lg font-semibold text-[var(--color-dorado)] mb-3">Descripción Holística</h3>
              <p id="detalle-descripcion" class="text-gray-600 whitespace-pre-line leading-relaxed text-lg"></p>
            </div>
          </div>
          <div id="detalle-acciones" class="mt-5"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- CARRITO MODAL -->
  <div id="carrito-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden transition-opacity">
    <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-2xl flex flex-col">
      <div class="p-5 border-b flex justify-between items-center bg-[var(--color-fondo-crema)]">
        <h3 class="font-bold text-xl text-[var(--color-dorado)] flex items-center gap-2.5">
          <i class="fa-solid fa-cart-shopping text-[var(--color-azul-gris)]"></i> Tu Pedido
        </h3>
        <button onclick="toggleCarrito()" class="text-gray-400 hover:text-gray-600 text-3xl font-bold px-3">&times;</button>
      </div>

      <div id="carrito-items" class="p-5 flex-grow overflow-y-auto space-y-5 bg-white"></div>

      <div class="p-5 border-t bg-[var(--color-fondo-crema)] shadow-inner">
        <div class="flex justify-between items-center mb-5">
          <span class="text-gray-600 font-semibold text-lg tracking-wide">Total Estimado:</span>
          <span id="carrito-total" class="text-3xl font-bold text-[var(--color-texto-principal)]">$0</span>
        </div>
        <button onclick="enviarPedidoWhatsApp()" class="w-full bg-[var(--color-azul-gris)] hover:opacity-90 text-white font-bold py-4 rounded-xl transition flex items-center justify-center gap-3 shadow-lg shadow-[#8DAA9F33] text-lg">
          <i class="fa-brands fa-whatsapp text-2xl"></i> Enviar Pedido por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <script>
    let productosData = [];
    let carrito = [];
    let categoriaActual = 'TODAS';
    let productoActualId = null;

    document.addEventListener("DOMContentLoaded", () => {
      fetch(API_URL)
        .then(response => response.json())
        .then(data => {
          productosData = data;
          document.getElementById('loading').classList.add('hidden');
          mostrarVista('catalogo');
          renderizarFiltrosCategorias();
          renderizarCatalogo();
        })
        .catch(err => {
          console.error("Error al cargar:", err);
          document.getElementById('loading').innerHTML = `<p class="text-red-500 font-bold">Error al conectar con la base de datos holística.</p>`;
        });
    });

    function renderizarFiltrosCategorias() {
      const contenedor = document.getElementById('categorias-botones');
      const categoriasSet = new Set();
      productosData.forEach(p => { if(p.categoria) categoriasSet.add(p.categoria); });
      
      let html = `<button onclick="filtrarCategoria('TODAS')" class="px-5 py-2.5 rounded-full text-sm font-semibold transition border ${categoriaActual === 'TODAS' ? 'bg-[var(--color-dorado)] text-white shadow-md border-[var(--color-dorado)]' : 'bg-white text-gray-600 border-gray-200 hover:bg-[var(--color-fondo-crema)]'}">Todas</button>`;
      
      categoriasSet.forEach(cat => {
        html += `<button onclick="filtrarCategoria('${cat}')" class="px-5 py-2.5 rounded-full text-sm font-semibold transition border ${categoriaActual === cat ? 'bg-[var(--color-dorado)] text-white shadow-md border-[var(--color-dorado)]' : 'bg-white text-gray-600 border-gray-200 hover:bg-[var(--color-fondo-crema)]'}">${cat}</button>`;
      });

      contenedor.innerHTML = html;
    }

    function filtrarCategoria(cat) {
      categoriaActual = cat;
      document.getElementById('titulo-categoria-activa').innerText = cat === 'TODAS' ? 'Todos los Productos' : cat;
      renderizarFiltrosCategorias();
      renderizarCatalogo();
    }

    function renderizarCatalogo() {
      const grid = document.getElementById('grid-productos');
      grid.innerHTML = '';

      const filtrados = categoriaActual === 'TODAS' ? productosData : productosData.filter(p => p.categoria === categoriaActual);

      filtrados.forEach(prod => {
        const tieneStock = prod.stock === 'SI';
        const card = document.createElement('div');
        card.className = `bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col hover:shadow-lg transition-shadow duration-300 cursor-pointer ${!tieneStock ? 'opacity-60' : ''}`;
        
        card.innerHTML = `
          <div class="aspect-square bg-gray-50 overflow-hidden relative" onclick="verDetalle('${prod.id}')">
            <img src="${prod.fotos[0]}" alt="${prod.nombre}" class="w-full h-full object-cover hover:scale-105 transition duration-500">
            ${!tieneStock ? '<span class="absolute top-3 right-3 bg-[var(--color-texto-principal)] text-white text-xs px-2.5 py-1.5 rounded-full font-bold shadow-md">Sin Stock</span>' : ''}
          </div>
          <div class="p-5 flex flex-col flex-grow justify-between">
            <div onclick="verDetalle('${prod.id}')">
              <span class="text-xs font-semibold text-[var(--color-azul-gris)] uppercase tracking-wider">${prod.categoria}</span>
              <h3 class="font-bold text-[var(--color-dorado)] mt-2 line-clamp-2 text-lg leading-snug">${prod.nombre}</h3>
              <p class="text-xl font-bold text-[var(--color-texto-principal)] mt-3">$${prod.precio.toLocaleString()}</p>
            </div>
            <button 
              onclick="agregarAlCarritoDesdeCatalogo('${prod.id}')" 
              ${!tieneStock ? 'disabled' : ''}
              class="mt-5 w-full py-3 px-4 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2.5 ${tieneStock ? 'bg-[var(--color-azul-gris)] text-white hover:opacity-90 shadow-lg shadow-[#8DAA9F1A]' : 'bg-gray-100 text-gray-400 cursor-not-allowed border border-gray-200'}">
              <i class="fa-solid fa-cart-plus"></i> ${tieneStock ? 'Agregar al Pedido' : 'Sin Stock'}
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function verDetalle(id) {
      const prod = productosData.find(p => p.id === id);
      if (!prod) return;
      productoActualId = id;

      document.getElementById('detalle-nombre').innerText = prod.nombre;
      document.getElementById('detalle-categoria').innerText = prod.categoria;
      document.getElementById('detalle-precio').innerText = `$${prod.precio.toLocaleString()}`;
      document.getElementById('detalle-descripcion').innerText = prod.descripcion || "Sin descripción holística disponible.";
      
      const imgPrincipal = document.getElementById('detalle-img-principal');
      imgPrincipal.src = prod.fotos[0];

      const miniaturasContenedor = document.getElementById('detalle-miniaturas');
      miniaturasContenedor.innerHTML = '';
      
      prod.fotos.forEach((foto, index) => {
        const thumb = document.createElement('img');
        thumb.src = foto;
        thumb.className = `w-16 h-16 object-cover rounded-xl border-2 cursor-pointer transition flex-shrink-0 shadow-inner ${index === 0 ? 'border-[var(--color-dorado)]' : 'border-gray-100 hover:border-[var(--color-azul-gris)]'}`;
        thumb.onclick = () => {
          imgPrincipal.src = foto;
          Array.from(miniaturasContenedor.children).forEach(c => c.classList.replace('border-[var(--color-dorado)]', 'border-gray-100'));
          thumb.classList.replace('border-gray-100', 'border-[var(--color-dorado)]');
        };
        miniaturasContenedor.appendChild(thumb);
      });

      const contenedorAroma = document.getElementById('contenedor-aroma');
      const selectAroma = document.getElementById('select-aroma');
      selectAroma.innerHTML = '';

      if (prod.aromas && prod.aromas.trim() !== "") {
        const listaAromas = prod.aromas.split(',').map(a => a.trim());
        listaAromas.forEach(aroma => {
          const opt = document.createElement('option');
          opt.value = aroma;
          opt.innerText = aroma;
          selectAroma.appendChild(opt);
        });
        contenedorAroma.classList.remove('hidden');
      } else {
        contenedorAroma.classList.add('hidden');
      }

      const accionesDiv = document.getElementById('detalle-acciones');
      if (prod.stock === 'SI') {
        accionesDiv.innerHTML = `
          <button onclick="agregarAlCarritoDesdeDetalle('${prod.id}')" class="w-full bg-[var(--color-azul-gris)] hover:opacity-90 text-white font-bold py-4 px-6 rounded-2xl transition flex items-center justify-center gap-2.5 shadow-lg shadow-[#8DAA9F33] text-lg">
            <i class="fa-solid fa-cart-plus"></i> Agregar al Carrito
          </button>
        `;
      } else {
        accionesDiv.innerHTML = `
          <div class="bg-[var(--color-fondo-crema)] text-gray-500 font-semibold text-center py-4 rounded-2xl border-2 border-dashed border-gray-200">
            Producto Sin Stock Actualmente
          </div>
        `;
      }

      mostrarVista('detalle');
    }

    function mostrarVista(vista) {
      document.getElementById('vista-catalogo').classList.toggle('hidden', vista !== 'catalogo');
      document.getElementById('vista-detalle').classList.toggle('hidden', vista !== 'detalle');
      window.scrollTo(0, 0);
    }

    function agregarAlCarritoDesdeCatalogo(id) {
      const prod = productosData.find(p => p.id === id);
      if (!prod || prod.stock !== 'SI') return;

      if (prod.aromas && prod.aromas.trim() !== "") {
        verDetalle(id);
        return;
      }

      agregarItemAlCarrito(id, null);
    }

    function agregarAlCarritoDesdeDetalle(id) {
      const contenedorAroma = document.getElementById('contenedor-aroma');
      let aromaSeleccionado = null;

      if (!contenedorAroma.classList.contains('hidden')) {
        const selectAroma = document.getElementById('select-aroma');
        aromaSeleccionado = selectAroma.value;
      }

      agregarItemAlCarrito(id, aromaSeleccionado);
    }

    function agregarItemAlCarrito(id, aroma) {
      const prod = productosData.find(p => p.id === id);
      if (!prod || prod.stock !== 'SI') return;

      const cartKey = id + (aroma ? `-${aroma}` : '');
      const itemExistente = carrito.find(item => item.cartKey === cartKey);

      if (itemExistente) {
        itemExistente.cantidad++;
      } else {
        carrito.push({
          cartKey: cartKey,
          id: prod.id,
          nombre: prod.nombre,
          precio: prod.precio,
          aroma: aroma,
          cantidad: 1
        });
      }

      actualizarCarritoUI();
      toggleCarrito(true);
    }

    function cambiarCantidad(cartKey, cambio) {
      const item = carrito.find(i => i.cartKey === cartKey);
      if (!item) return;

      item.cantidad += cambio;
      if (item.cantidad <= 0) {
        carrito = carrito.filter(i => i.id !== cartKey);
      }
      actualizarCarritoUI();
    }

    function actualizarCarritoUI() {
      const itemsContainer = document.getElementById('carrito-items');
      const countLabel = document.getElementById('cart-count');
      const totalLabel = document.getElementById('carrito-total');

      const totalItems = carrito.reduce((sum, i) => sum + i.cantidad, 0);
      const totalPrecio = carrito.reduce((sum, i) => sum + (i.precio * i.cantidad), 0);

      countLabel.innerText = totalItems;
      countLabel.classList.toggle('hidden', totalItems === 0);
      totalLabel.innerText = `$${totalPrecio.toLocaleString()}`;

      itemsContainer.innerHTML = '';

      if (carrito.length === 0) {
        itemsContainer.innerHTML = `
          <div class="text-center py-12 text-gray-400">
            <i class="fa-solid fa-basket-shopping text-5xl mb-4 text-[var(--color-azul-gris)] opacity-50"></i>
            <p class="text-lg font-medium">Tu pedido holístico está vacío.</p>
          </div>
        `;
        return;
      }

      carrito.forEach(item => {
        const div = document.createElement('div');
        div.className = 'flex justify-between items-center border border-gray-100 rounded-xl p-4 bg-white shadow-inner';
        div.innerHTML = `
          <div>
            <h4 class="font-bold text-[var(--color-dorado)] text-base">${item.nombre}</h4>
            ${item.aroma ? `<p class="text-sm text-[var(--color-azul-gris)] font-medium">Aroma: ${item.aroma}</p>` : ''}
            <p class="text-sm text-[var(--color-texto-principal)] font-bold tracking-wide">$${item.precio.toLocaleString()} c/u</p>
          </div>
          <div class="flex items-center gap-2.5 bg-[var(--color-fondo-crema)] rounded-lg p-1.5 border border-gray-100">
            <button onclick="cambiarCantidad('${item.cartKey}', -1)" class="w-8 h-8 rounded-lg bg-white font-bold hover:bg-gray-100 border border-gray-100">-</button>
            <span class="text-base font-semibold w-6 text-center text-[var(--color-texto-principal)]">${item.cantidad}</span>
            <button onclick="cambiarCantidad('${item.cartKey}', 1)" class="w-8 h-8 rounded-lg bg-white font-bold hover:bg-gray-100 border border-gray-100">+</button>
          </div>
        `;
        itemsContainer.appendChild(div);
      });
    }

    function toggleCarrito(forzarAbrir = false) {
      const modal = document.getElementById('carrito-modal');
      if (forzarAbrir) {
        modal.classList.remove('hidden');
      } else {
        modal.classList.toggle('hidden');
      }
    }

    function enviarPedidoWhatsApp() {
      if (carrito.length === 0) {
        alert("Agrega productos al carrito antes de enviar el pedido.");
        return;
      }

      let mensaje = "¡Hola *Aura Oeste*! Quisiera realizar el siguiente pedido holístico desde el catálogo:\n\n";
      let total = 0;

      carrito.forEach(item => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        const textoAroma = item.aroma ? ` (Aroma: ${item.aroma})` : '';
        mensaje += `• *${item.cantidad}x* ${item.nombre}${textoAroma} - _$${subtotal.toLocaleString()}_ \n`;
      });

      mensaje += `\n*TOTAL ESTIIMADO: $${total.toLocaleString()}* \n\n¿Tienen disponibilidad para coordinar la entrega? Muchas gracias.`;

      const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
